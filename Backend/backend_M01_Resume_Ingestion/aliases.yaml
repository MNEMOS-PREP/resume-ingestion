# Skill aliases — the surface forms students write, and what they mean.
#
# Spec §6.4: *"The alias table is a versioned YAML ... seeded with ~2,000
# entries and grown from the unmapped queue."*  This is the seed. It is nowhere
# near two thousand and it is not trying to be: every entry here earns its place
# by being a form that students actually write and that an exact match would
# miss, and a table padded to hit a number is a table nobody curates.
#
# ── What this file is NOT ────────────────────────────────────────────────────
#
# It is not the ontology. M04 owns concepts; this maps a student's spelling to a
# canonical NAME, and the resolver then asks M04 what concept that name is. A
# hit here is `alias_exact` against a curated table, and it still carries
# `offline_alias` provenance if M04 never confirms the concept exists — the two
# facts are separate and both travel.
#
# ── How to grow it ───────────────────────────────────────────────────────────
#
# From `GET /v1/resumes/{id}/skills` → `unmapped_queue`, which is ordered by how
# often students wrote the thing. §6.4 calls that queue "a feature, not debt —
# it is how the ontology learns what students actually write". Take the top of
# the list, decide whether it is one canonical name or several, add it here.
#
# Format:
#   canonical name:
#     - the spellings that mean it
#
# Canonical names are Title Case as a human would write them. Aliases are
# matched case-insensitively and after punctuation folding, so "node.js" and
# "Node JS" both only need to appear once in whichever form reads clearest.

