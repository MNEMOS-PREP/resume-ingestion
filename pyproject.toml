[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interviewer-m01"
version = "0.1.0"
description = "AI Interviewer — M01 Resume Ingestion & Claim Extract"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30",
    "ai-core @ git+https://github.com/MNEMOS-PREP/Platform_Core@v0.5.0#subdirectory=python",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["Backend"]
include = ["backend_*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["Backend"]
testpaths = ["Backend/backend_M01_Resume_Ingestion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["BLE001", "E501"] # Ignore blind exceptions and line length limits
[tool.ruff.lint.per-file-ignores]
"**/router.py" = ["B008"]
